<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Create Recipe</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="script2.js"></script>
  </head>
  <body>
    <nav>
      <a href="/">Home</a>
      <a href="/page2.html" aria-current="Recipies">Baking Recipes</a>
    </nav>
    <main>
      <h1>This is where you make recipes and save them</h1>

      <!-- Button to open modal -->
      <button id="myBtn">Make Recipe</button>

      <!-- Modal structure -->
      <div id="myModal" style="display: none;">
        <div class="modal-content">
          <span class="close">&times;</span>
          <h2>Create Your Recipe</h2>
          <!-- Recipe form -->
          <form id="recipeForm">
            <label for="recipeTitle">Recipe Title:</label>
            <input type="text" id="recipeTitle" name="recipeTitle" required><br><br>

            <label for="ingredients">Ingredients (comma separated):</label>
            <textarea id="ingredients" name="ingredients" rows="4" required></textarea><br><br>

            <label for="instructions">Instructions:</label>
            <textarea id="instructions" name="instructions" rows="6" required></textarea><br><br>

            <button type="submit">Submit Recipe</button>
          </form>
        </div>
      </div>
    </main>
  </body>
</html>
