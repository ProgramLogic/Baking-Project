<!DOCTYPE html>
<html lang="en">
  <head>
    <title>AI Baking Assistant</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.16/dist/tailwind.min.css" rel="stylesheet">
    <link rel="shortcut icon" type="image/x-icon" href="logo (1).png" />
    <script type="module" src="script.js"></script>
  </head>
  <body class="bg-gray-100 text-gray-800">
    <nav class="bg-blue-600 p-4">
      <div class="max-w-screen-xl mx-auto flex justify-between items-center flex-wrap gap-2">
        <a href="/" class="text-white text-lg font-semibold hover:text-gray-300">Home</a>
        <a href="/page2.html" class="text-white hover:text-gray-300">Baking Recipes</a>
        <a href="/page3.html" class="text-white hover:text-gray-300">Baking Unit Calculator</a>
        <a href="/page4.html" class="text-white hover:text-gray-300">Recipes of the Day</a>
        <a href="/page5.html" class="text-white hover:text-gray-300" aria-current="page">AI Baking Assistant</a>
        <a href="/page6.html" class="text-white hover:text-gray-300">Menu Finder</a>
        <a href="/page7.html" class="text-white hover:text-gray-300">Menu of Recipes</a>
      </div>
    </nav>

    <main class="container mx-auto py-8 px-4">
      <h1 class="text-4xl font-bold text-center mb-4 text-blue-700">Need help with cooking? Ask this AI</h1>
      
      <div class="text-center mb-6">
        <div class="flex justify-center">
          <img class="w-104 h-89" src="chatgpt.png" alt="AI Baking Assistant">
        </div>
      </div>

      <!-- Ask AI Box -->
      <div class="max-w-md mx-auto bg-white p-6 rounded-lg shadow-lg">
        <h2 class="text-2xl font-semibold text-center mb-4">Ask the AI</h2>
        <textarea id="userQuery" class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 mb-4" rows="4" placeholder="What baking help do you need?"></textarea>
        <button id="askAIButton" class="w-full py-3 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
          Ask AI
        </button>
      </div>
    </main>
    
    <script>
      
      document.getElementById('askAIButton').addEventListener('click', function() {
        const query = document.getElementById('userQuery').value;
        if (query.trim() !== '') {
          alert('You asked: ' + query);
          
        } else {
          alert('Please enter a question.');
        }
      });
    </script>
  </body>
</html>
